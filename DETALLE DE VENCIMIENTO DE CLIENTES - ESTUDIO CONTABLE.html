<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Clientes · Estudio Contable Lazarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0D1C; --navy:#18213D; --slate:#3B4A6B; --steel:#6E80A6; --mist:#A5B9DE; --fog:#E6ECF7; --bg:#F4F6FB; --card:#fff;
  --line:#E2E7F0; --muted:#667085; --text:#1D2433;
  --red:#B42318; --red-bg:#FEF3F2; --amber:#B54708; --amber-bg:#FFFAEB; --green:#067647; --green-bg:#ECFDF3; --blue:#3B4A6B; --blue-bg:#EEF2FA;
  --radius:12px; --shadow:0 1px 2px rgba(10,13,28,.05),0 4px 16px rgba(10,13,28,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--slate)}
.hidden{display:none!important}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:10px 24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand img{height:40px;width:auto}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font:300 22px/1 Jost,sans-serif;letter-spacing:.28em}
.brand .wm span{font:400 11px/1 Jost,sans-serif;letter-spacing:.12em;color:var(--slate);margin-top:5px}
nav.tabs{display:flex;gap:4px;flex:1}
nav.tabs a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs a:hover{background:var(--fog);color:var(--ink)}
nav.tabs a.on{background:var(--ink);color:#fff}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mist)}
.dot.ok{background:#12B76A}.dot.warn{background:#F79009}

main{max-width:1280px;margin:0 auto;padding:24px}
h1{font:400 26px/1.2 Jost,sans-serif;margin:0;color:var(--ink);letter-spacing:.01em}
h2{font:500 17px/1.3 Jost,sans-serif;margin:0;color:var(--ink)}
.sub{color:var(--muted);margin-top:4px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--steel)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:var(--navy)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.wa{background:#fff;border-color:#B7E4C7;color:#067647}
.btn.danger{color:var(--red);border-color:#FECDCA}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--fog)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{width:16px;height:16px;flex-shrink:0}

/* Cards / KPIs */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-b{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .lb{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:500 26px/1.2 Jost,sans-serif;color:var(--ink);margin-top:6px}
.kpi .n{color:var(--muted);font-size:13px;margin-top:2px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mist)}
.kpi.red::before{background:var(--red)}.kpi.amber::before{background:#F79009}.kpi.green::before{background:#12B76A}.kpi.navy::before{background:var(--ink)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
.grid2>*{min-width:0}
td.cli{min-width:150px}
td.cli .t2{white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:20px}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFD}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#F8FAFE}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .t1{font-weight:500;color:var(--ink)}
td .t2{font-size:12px;color:var(--muted)}
.nowrap{white-space:nowrap}
.acts{display:flex;gap:6px;justify-content:flex-end}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-red{background:var(--red-bg);color:var(--red)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-gray{background:#F2F4F7;color:#475467}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--slate);white-space:nowrap}
.cat i{width:8px;height:8px;border-radius:2px;display:inline-block}
.atraso{font-weight:700;color:var(--red)}

/* Toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1;min-width:220px;max-width:380px}
.search input{width:100%;padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;outline:none;min-height:38px}
input:focus,select:focus,textarea:focus{border-color:var(--steel);box-shadow:0 0 0 3px rgba(110,128,166,.18)}
textarea{min-height:70px;resize:vertical;width:100%}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.seg button .c{opacity:.7;margin-left:4px;font-size:12px}

/* Client cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ccard{padding:16px 18px;cursor:pointer;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:10px}
.ccard:hover{border-color:var(--steel);transform:translateY(-1px)}
.ccard .nm{font:500 16px/1.25 Jost,sans-serif;color:var(--ink)}
.ccard .meta{font-size:12px;color:var(--muted)}
.ccard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard .amt{font:500 18px Jost,sans-serif;color:var(--ink)}
.avatar{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--ink),var(--steel));color:#fff;display:flex;align-items:center;justify-content:center;font:500 15px Jost,sans-serif;flex-shrink:0;letter-spacing:.04em}

/* Client detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;margin-bottom:12px;font-weight:500;cursor:pointer;background:none;border:0;padding:0}
.back:hover{color:var(--ink)}
.dhead{display:flex;gap:16px;align-items:flex-start;padding:20px}
.dhead .avatar{width:56px;height:56px;font-size:20px;border-radius:14px}
.dhead .info{flex:1;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 24px;margin-top:14px}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.fact .val{margin-top:2px;color:var(--ink);word-break:break-word}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 20px}
.mini{padding:12px 16px}
.mini .lb{font-size:12px;color:var(--muted)}
.mini .v{font:500 20px Jost,sans-serif;color:var(--ink)}

/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty img{height:56px;opacity:.35;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font:500 16px Jost,sans-serif;margin-bottom:4px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,13,28,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(10,13,28,.3);animation:pop .16s ease-out}
.modal.sm{max-width:440px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.mb{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.mf{display:flex;justify-content:space-between;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#FAFBFD;border-radius:0 0 16px 16px;flex-wrap:wrap}
.mf .r{display:flex;gap:8px;margin-left:auto}
.fgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px 14px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12px;font-weight:600;color:var(--slate)}
.f label em{color:var(--red);font-style:normal}
.f input,.f select{width:100%}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
.sect{font:500 13px Jost,sans-serif;color:var(--steel);text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:10px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.estado-pick{display:flex;gap:8px}
.estado-pick label{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text);font-size:14px}
.estado-pick input{accent-color:var(--ink);width:auto!important;margin:0}
.estado-pick label.on-p{border-color:#F79009;background:var(--amber-bg)}
.estado-pick label.on-g{border-color:#12B76A;background:var(--green-bg)}

/* Dropzone */
.drop{border:1.5px dashed var(--mist);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:#FAFBFE;transition:.15s}
.drop:hover,.drop.over{border-color:var(--ink);background:var(--fog);color:var(--ink)}
.drop b{color:var(--ink)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.file{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;position:relative;display:flex;flex-direction:column}
.file .th{height:92px;background:var(--fog);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.file .th img{width:100%;height:100%;object-fit:cover}
.file .th .pdf{font:600 13px Jost,sans-serif;color:#fff;background:var(--red);padding:6px 10px;border-radius:6px;letter-spacing:.06em}
.file .nm{font-size:12px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(255,255,255,.95);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2);color:var(--red)}
.file.up .th{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.clip{display:inline-flex;align-items:center;gap:3px;color:var(--steel);font-size:12px}

/* Avisos */
.avisos{display:flex;flex-direction:column;gap:8px}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;background:#FAFBFD;border:1px solid var(--line);border-radius:10px}
.aviso .fd{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:1px;font-variant-numeric:tabular-nums}
.aviso .tx{flex:1}
.aviso button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px}
.aviso button:hover{color:var(--red)}
.addaviso{display:flex;gap:8px}
.addaviso input[type=text]{flex:1}

/* Viewer */
.viewer{max-width:1000px}
.viewer .vb{background:#1D2433;display:flex;justify-content:center;align-items:center;min-height:300px}
.viewer img{max-width:100%;max-height:75vh;display:block}
.viewer iframe{width:100%;height:75vh;border:0;background:#fff}

/* Toast / banner */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:500;animation:pop .16s}
.toast.err{background:var(--red)}
.banner{background:var(--amber-bg);border:1px solid #FEDF89;color:var(--amber);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}

/* Bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar .bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar .bl span:last-child{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.bar .bt{height:8px;background:var(--fog);border-radius:99px;overflow:hidden}
.bar .bt i{display:block;height:100%;border-radius:99px}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:#F8FAFE}
.li .grow{flex:1;min-width:0}
.li .grow .t1{font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox{width:46px;text-align:center;border-radius:9px;background:var(--fog);padding:5px 0;flex-shrink:0}
.datebox b{display:block;font:500 17px/1 Jost,sans-serif;color:var(--ink)}
.datebox span{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.datebox.red{background:var(--red-bg)}.datebox.red b{color:var(--red)}
.datebox.amber{background:var(--amber-bg)}.datebox.amber b{color:var(--amber)}

footer{max-width:1280px;margin:0 auto;padding:8px 24px 32px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.msgbox{width:100%;min-height:200px;font-size:13px;line-height:1.5}

@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media (max-width:720px){
  .top-in{flex-wrap:wrap;padding:10px 14px;gap:10px}
  nav.tabs{order:3;flex:1 1 100%;overflow-x:auto}
  .top-in>.btn{margin-left:auto}
  .sync{display:none}
  main{padding:16px 14px}
  .fgrid{grid-template-columns:repeat(2,1fr)}
  .s3,.s4,.s6{grid-column:span 2}.s2{grid-column:span 1}
  .minis{grid-template-columns:1fr}
  .kpis{gap:10px}.kpi .v{font-size:20px}
  .estado-pick{flex-direction:column}
  .hide-m{display:none}
}
</style>
</head>

function parseImporte(v){ if(typeof v==="number") return v; let s=String(v||"").trim().replace(/[^\d.,-]/g,""); if(s.includes(",")){s=s.replace(/\./g,"").replace(",",".");} return Number(s)||0; }
function waNumber(cel){
  let d=String(cel||"").replace(/\D/g,""); if(!d) return "";
  if(d.startsWith("00")) d=d.slice(2);
  if(d.startsWith("54")){ d=d.slice(2); if(d.startsWith("9")) d=d.slice(1); }
  if(d.startsWith("0")) d=d.slice(1);
  // quitar "15" luego de característica (2 a 4 dígitos) si quedan 12 dígitos
  if(d.length===12){ for(const L of [2,3,4]){ if(d.slice(L,L+2)==="15"){ d=d.slice(0,L)+d.slice(L+2); break; } } }
  return "549"+d;
}

/* ---------- Almacenamiento (base compartida o local) ---------- */
const Store = {
  mode:"init", db:null, assets:null, subs:{}, local:null, canWrite:true,
  async init(onData){
    this.onData = onData;
    this.mode="local"; this.loadLocal();
  },
  subscribe(){
    const loaded={clientes:false,deudas:false};
    const timer=setTimeout(()=>{ if(!loaded.clientes||!loaded.deudas) setSync("warn","Sin conexión con la base"); },10000);
    for(const coll of ["clientes","deudas"]){
      this.db.collection(coll).onSnapshot(snap=>{
        const m=new Map(); snap.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()}));
        state[coll]=m;
        if(!snap.metadata.fromCache){ loaded[coll]=true; if(loaded.clientes&&loaded.deudas){ clearTimeout(timer); setSync("ok","Sincronizado"); } }
        state.ready=true; this.onData();
      }, err=>{ clearTimeout(timer); setSync("warn","Error de conexión"); toast("No se pudo leer la base de datos ("+err.code+")",true); });
    }
  },
  loadLocal(){
    let raw=null; try{ raw=JSON.parse(localStorage.getItem("lazarte_crm_v1")||"null"); }catch(e){}
    this.local = raw || {clientes:{},deudas:{}};
    state.clientes=new Map(Object.entries(this.local.clientes).map(([k,v])=>[k,{id:k,...v}]));
    state.deudas=new Map(Object.entries(this.local.deudas).map(([k,v])=>[k,{id:k,...v}]));
    state.ready=true; setSync("ok","Guardado en esta computadora"); this.onData();
  },
  saveLocal(){ try{ localStorage.setItem("lazarte_crm_v1",JSON.stringify(this.local)); }catch(e){ toast("No se pudo guardar en el navegador",true); } },
  replaceAll(data){ this.local={clientes:data.clientes||{},deudas:data.deudas||{}}; this.saveLocal(); this.loadLocal(); },
  async set(coll,id,obj){
    const body={...obj}; delete body.id;
    if(this.mode==="db"){
      try{ await this.db.collection(coll).doc(id).set(body); }
      catch(e){ if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); await this.db.collection(coll).doc(id).set(body); } else throw e; }
    } else {
      this.local[coll][id]=body; state[coll].set(id,{id,...body}); this.saveLocal(); this.onData();
    }
  },
  async del(coll,id){
    if(this.mode==="db"){ await this.db.collection(coll).doc(id).delete(); }
    else { delete this.local[coll][id]; state[coll].delete(id); this.saveLocal(); this.onData(); }
  },
  async upload(file){ if(!this.assets) throw new Error("Adjuntos no disponibles"); return await this.assets.upload(file); },
  async removeAsset(id){ try{ if(this.assets&&id) await this.assets.delete(id); }catch(e){} }
};
function errMsg(e){
  const c=e&&e.code;
  if(c==="invalid_argument") return "No tenés permiso para modificar datos o el registro es demasiado grande.";
  if(c==="quota_exceeded") return "Se alcanzó el límite de almacenamiento. Eliminá registros antiguos.";
  if(c==="resource_exhausted") return "Demasiadas operaciones seguidas. Esperá unos segundos.";
  return "No se pudo guardar. Revisá la conexión e intentá de nuevo.";
}

/* ---------- Lógica de negocio ---------- */
function info(d){
  if(d.estado==="pagado"){
    const late = (d.fechaPago&&d.fechaVto) ? diffDays(d.fechaPago,d.fechaVto) : 0;
    return {k:"pagado", label:"Pagado", cls:"b-green", dias: late>0?late:0, sort:3};
  }
  if(!d.fechaVto) return {k:"pend", label:"Pendiente", cls:"b-blue", dias:0, sort:2};
  const dv = diffDays(TODAY,d.fechaVto);
  if(dv>0)  return {k:"venc", label:"Vencido", cls:"b-red", dias:dv, sort:0};
  if(dv===0) return {k:"hoy", label:"Vence hoy", cls:"b-amber", dias:0, sort:1};
  if(dv>=-7) return {k:"prox", label:`Vence en ${-dv} día${dv===-1?"":"s"}`, cls:"b-amber", dias:0, sort:1};
  return {k:"pend", label:"Pendiente", cls:"b-blue", dias:0, sort:2};
}
const isPend = d => d.estado!=="pagado";
const deudasDe = cid => [...state.deudas.values()].filter(d=>d.clienteId===cid);
const cliente = id => state.clientes.get(id);
const clientesOrden = () => [...state.clientes.values()].sort((a,b)=>(a.razon||"").localeCompare(b.razon||"","es"));
function resumen(list){
  const r={pend:0,pendN:0,venc:0,vencN:0,prox:0,proxN:0};
  for(const d of list){ if(!isPend(d)) continue; const i=info(d); const imp=Number(d.importe)||0;
    r.pend+=imp; r.pendN++; if(i.k==="venc"){r.venc+=imp;r.vencN++;} if(i.k==="hoy"||i.k==="prox"){r.prox+=imp;r.proxN++;} }
  return r;
}
function sortDeudas(list){
  return list.sort((a,b)=>{ const ia=info(a), ib=info(b);
    if(ia.sort!==ib.sort) return ia.sort-ib.sort;
    if(ia.k==="pagado") return (b.fechaPago||"").localeCompare(a.fechaPago||"");
    return (a.fechaVto||"9999").localeCompare(b.fechaVto||"9999"); });
}
function mensajeAviso(c, deudas){
  const saludo = c.contacto ? `Hola ${c.contacto}` : `Hola`;
  const lineas = deudas.map(d=>{ const i=info(d); const ct=CAT[d.categoria]?.n||"";
    return `• ${d.concepto||ct}${d.periodo?" — Período "+d.periodo:""}${d.cuota?" — Cuota "+d.cuota:""}: ${fmt$(d.importe)} — Vence ${fmtD(d.fechaVto)}${i.k==="venc"?" (VENCIDO hace "+i.dias+" días)":""}`; });
  const total = deudas.reduce((s,d)=>s+(Number(d.importe)||0),0);
  const medio = c.medioPago ? `\nMedio de pago: ${c.medioPago}.` : "";
  const pl = deudas.length>1;
  return `${saludo}, ¿cómo estás? Te escribimos del Estudio Contable Lazarte para recordarte ${pl?"los siguientes vencimientos pendientes":"el siguiente vencimiento pendiente"} de ${c.razon}:\n\n${lineas.join("\n")}${pl?`\n\nTotal: ${fmt$(total)}`:""}${medio}\n\nUna vez abonado, por favor envianos el comprobante. ¡Muchas gracias!\nEstudio Contable Lazarte`;
}
function waLink(c, deudas){
  const n=waNumber(c.cel); if(!n) return "";
  return "https://wa.me/"+n+"?text="+encodeURIComponent(mensajeAviso(c,deudas));
}

/* ---------- Componentes ---------- */
function catTag(k){ const c=CAT[k]||CAT.otro; return `<span class="cat"><i style="background:${c.c}"></i>${esc(c.n)}</span>`; }
function estadoBadge(d){ const i=info(d); return `<span class="badge ${i.cls}">${esc(i.label)}</span>`; }
function atrasoCell(d){ const i=info(d);
  if(i.k==="venc") return `<span class="atraso">${i.dias} día${i.dias===1?"":"s"}</span>`;
  if(i.k==="pagado" && i.dias>0) return `<span class="t2">${i.dias} d (pagó tarde)</span>`;
  return `<span class="t2">—</span>`; }
function clip(d){ return ""; }
function datebox(iso,cls=""){ if(!iso) return `<div class="datebox"><b>—</b><span>s/f</span></div>`; const [y,m,d]=iso.split("-"); return `<div class="datebox ${cls}"><b>${+d}</b><span>${MESES[+m-1]}</span></div>`; }
function emptyBox(t,s,btn=""){ return `<div class="empty"><img src="${ICON}" alt=""><b>${esc(t)}</b><div>${esc(s)}</div>${btn?`<div style="margin-top:14px">${btn}</div>`:""}</div>`; }

function deudasTable(list, {showCliente=true, actions=true, compact=false}={}){
  if(!list.length) return "";
  return `<div class="tbl-wrap"><table><thead><tr>
    ${showCliente?"<th>Cliente</th>":""}<th>Concepto</th><th>Envío</th><th>Vencimiento</th><th class="num">Importe</th><th>Estado</th><th>Atraso</th>${compact?"":'<th class="hide-m">Último aviso</th>'}${actions?"<th></th>":""}
  </tr></thead><tbody>${list.map(d=>{
    const c=cliente(d.clienteId)||{}; const av=(d.avisos||[]).slice(-1)[0];
    const pend=isPend(d);
    return `<tr class="click" data-act="ver-deuda" data-id="${d.id}">
      ${showCliente?`<td class="cli"><div class="t1">${esc(c.razon||"(cliente eliminado)")}</div><div class="t2">${esc(fmtCuit(c.cuit))}</div></td>`:""}
      <td><div class="t1">${esc(d.concepto||CAT[d.categoria]?.n||"")} ${clip(d)}</div><div class="t2">${catTag(d.categoria)}${d.periodo?" · "+esc(d.periodo):""}${d.cuota?" · Cuota "+esc(d.cuota):""}</div></td>
      <td class="nowrap">${d.fechaEnvio?fmtD(d.fechaEnvio):'<span class="badge b-gray">Sin enviar</span>'}</td>
      <td class="nowrap">${fmtD(d.fechaVto)}${d.estado==="pagado"&&d.fechaPago?`<div class="t2">Pagó ${fmtD(d.fechaPago)}</div>`:""}</td>
      <td class="num">${fmt$(d.importe)}</td>
      <td>${estadoBadge(d)}</td>
      <td class="nowrap">${atrasoCell(d)}</td>
      ${compact?"":`<td class="hide-m" style="max-width:220px">${av?`<div class="t2">${fmtD(av.fecha)}</div><div style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(av.texto)}</div>`:'<span class="t2">—</span>'}</td>`}
      ${actions?`<td><div class="acts">
        ${pend?`<button class="btn sm ok" data-act="pagar" data-id="${d.id}" title="Marcar como pagado">${SVG.check}<span class="hide-m">Pagado</span></button>`:`<button class="btn sm" data-act="reabrir" data-id="${d.id}" title="Volver a pendiente">Reabrir</button>`}
      </div></td>`:""}
    </tr>`; }).join("")}</tbody></table></div>`;
}

  const meses=[...new Set([...state.deudas.values()].map(d=>(d.fechaVto||"").slice(0,7)).filter(Boolean))].sort().reverse();
  return `<div class="pagehead"><div><h1>VEPs y deudas</h1><div class="sub">Todas las obligaciones cargadas, de todos los clientes.</div></div>
    <div style="display:flex;gap:8px"><button class="btn" data-act="csv">Descargar Excel (CSV)</button><button class="btn" data-act="copiar-tabla">${SVG.copy}Copiar</button><button class="btn pri" data-act="nueva-deuda">${SVG.plus}Cargar VEP / deuda</button></div></div>
  <div class="toolbar">
    <div class="search">${SVG.search}<input type="search" id="q" placeholder="Buscar cliente, concepto, período, N° VEP…" value="${esc(state.f.q)}"></div>
    <div class="seg" id="estseg"></div>
    <select id="fcat"><option value="">Todos los tipos</option>${CATS.map(c=>`<option value="${c.k}" ${state.f.cat===c.k?"selected":""}>${esc(c.n)}</option>`).join("")}</select>
    <select id="fmes"><option value="">Todos los meses</option>${meses.map(m=>{const[y,mm]=m.split("-");return `<option value="${m}" ${state.f.mes===m?"selected":""}>Vto. ${MESES[+mm-1]} ${y}</option>`;}).join("")}</select>
  </div>
  <div class="card" id="region"></div>`;
}
function filtradas(){
  const q=state.f.q.trim().toLowerCase();
  const base=[...state.deudas.values()].filter(d=>{
    if(state.f.cat && (d.categoria||"otro")!==state.f.cat) return false;
    if(state.f.mes && !(d.fechaVto||"").startsWith(state.f.mes)) return false;
    if(q){ const c=cliente(d.clienteId)||{}; const hay=[c.razon,c.cuit,d.concepto,d.periodo,d.nroVep,d.observaciones,CAT[d.categoria]?.n].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true; });
  const cnt={todas:base.length,pend:base.filter(isPend).length,venc:base.filter(d=>info(d).k==="venc").length,pag:base.filter(d=>!isPend(d)).length};
  const e=state.f.estado;
  const list=base.filter(d=> e==="todas"||(e==="pend"&&isPend(d))||(e==="venc"&&info(d).k==="venc")||(e==="pag"&&!isPend(d)));
  return {list:sortDeudas(list),cnt};
}
function fillVenc(){
  const {list,cnt}=filtradas();
  $("#estseg").innerHTML=[["pend","Pendientes"],["venc","Vencidas"],["pag","Pagadas"],["todas","Todas"]].map(([k,n])=>`<button data-est="${k}" class="${state.f.estado===k?"on":""}">${n}<span class="c">${cnt[k]}</span></button>`).join("");
  const tot=list.reduce((s,d)=>s+(Number(d.importe)||0),0);
  $("#region").innerHTML = list.length ? deudasTable(list)+`<div class="card-b" style="border-top:1px solid var(--line);display:flex;justify-content:space-between;font-weight:600"><span>${list.length} registro${list.length===1?"":"s"}</span><span>Total ${fmt$(tot)}</span></div>`
    : emptyBox(state.deudas.size?"Sin resultados":"Todavía no hay deudas cargadas", state.deudas.size?"Probá con otros filtros.":"Cargá el primer VEP o deuda de un cliente.", state.deudas.size?"":`<button class="btn pri" data-act="nueva-deuda">${SVG.plus}Cargar VEP / deuda</button>`);
}

/* ---------- Router / render ---------- */
let shellFor=null;
function render(){
  const app=$("#app");
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on", a.dataset.r===state.route || (state.route==="cliente"&&a.dataset.r==="clientes")));
  if(!state.ready){ app.innerHTML=`<div class="empty"><img src="${ICON}" alt=""><b>Cargando datos…</b></div>`; shellFor=null; return; }
  const key=state.route+"|"+(state.clienteId||"");
  if(state.route==="clientes"){ if(shellFor!==key){ app.innerHTML=viewClientesShell(); shellFor=key; } fillClientes(); }
  else if(state.route==="vencimientos"){ if(shellFor!==key){ app.innerHTML=viewVencShell(); shellFor=key; } fillVenc(); }
  else if(state.route==="cliente"){ app.innerHTML=viewCliente(); shellFor=null; }
  else { app.innerHTML=viewPanel(); shellFor=null; }
  refreshOpenModal();
}
function readHash(){
  const h=(location.hash||"").slice(1);
  if(h.startsWith("cliente-")){ state.route="cliente"; state.clienteId=h.slice(8); }
  else if(["panel","clientes","vencimientos"].includes(h)){ state.route=h; state.clienteId=null; }
  else { state.route="panel"; state.clienteId=null; }
}
function go(h){ if(location.hash==="#"+h){ readHash(); render(); } else location.hash=h; window.scrollTo(0,0); }
window.addEventListener("hashchange",()=>{ const prev=state.route+state.clienteId; readHash(); if(state.route==="cliente" && prev!==state.route+state.clienteId) state.f.dtab="pend"; shellFor=null; render(); window.scrollTo(0,0); });

function setSync(k,t){ $("#sync").innerHTML=`<span class="dot ${k}"></span><span>${esc(t)}</span>`; }
let toastT; function toast(msg,err=false){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"+(err?" err":""); t.textContent=msg; document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),err?5000:2600); }
async function copyText(txt,ok="Copiado al portapapeles"){ try{ await navigator.clipboard.writeText(txt); toast(ok); }catch(e){ showText("Copiar manualmente",txt); } }

let modal=null; // {type, ...}
function openModal(html, cls=""){ $("#modal-root").innerHTML=`<div class="overlay" id="ov"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`; document.body.style.overflow="hidden"; }
function closeModal(){ $("#modal-root").innerHTML=""; document.body.style.overflow=""; modal=null; }
function refreshOpenModal(){ /* los modales trabajan sobre un borrador; no se re-renderizan con datos */ }

function confirmDlg(title,text,okLabel="Eliminar",danger=true){
  return new Promise(res=>{
    const prev=$("#modal-root").innerHTML; const prevModal=modal;
    const wrap=document.createElement("div");
    wrap.innerHTML=`<div class="overlay" style="z-index:70"><div class="modal sm"><div class="mh"><h2>${esc(title)}</h2></div><div class="mb"><div>${esc(text)}</div></div><div class="mf"><div class="r"><button class="btn" data-c="0">Cancelar</button><button class="btn ${danger?"danger":"pri"}" data-c="1" style="${danger?"background:var(--red);color:#fff;border-color:var(--red)":""}">${esc(okLabel)}</button></div></div></div></div>`;
    document.body.appendChild(wrap);
    wrap.addEventListener("click",e=>{ const b=e.target.closest("[data-c]"); if(b){ wrap.remove(); res(b.dataset.c==="1"); } else if(e.target.classList.contains("overlay")){ wrap.remove(); res(false);} });
  });
}
function showText(title,txt,extra=""){
  modal={type:"text"};
  openModal(`<div class="mh"><h2>${esc(title)}</h2><button class="btn ghost sm" data-act="close">${SVG.x}</button></div>
    <div class="mb"><textarea class="msgbox" id="msgtxt">${esc(txt)}</textarea></div>
    <div class="mf"><div class="r">${extra}<button class="btn pri" data-act="copiar-msg">${SVG.copy}Copiar</button></div></div>`);
}

async function saveCliente(form){
  const fd=Object.fromEntries(new FormData(form));
  const cuitD=fd.cuit.replace(/\D/g,"");
  if(!fd.razon.trim()) return toast("Ingresá la razón social",true);
  if(cuitD.length!==11) return toast("El CUIT debe tener 11 dígitos",true);
  const dup=[...state.clientes.values()].find(x=>x.cuit===cuitD && x.id!==modal.id);
  if(dup) return toast("Ya existe un cliente con ese CUIT: "+dup.razon,true);
  const id=modal.id||uid("c"); const prev=cliente(id)||{};
  const obj={...prev, razon:fd.razon.trim(), cuit:cuitD, tipo:fd.tipo, medioPago:fd.medioPago, contacto:fd.contacto.trim(), cel:fd.cel.trim(), mail:fd.mail.trim(), notas:fd.notas.trim(), creado:prev.creado||new Date().toISOString(), actualizado:new Date().toISOString()};
  const btn=form.querySelector("[type=submit]"); btn.disabled=true;
  try{ await Store.set("clientes",id,obj); const isNew=!modal.id; closeModal(); toast(isNew?"Cliente creado":"Cliente actualizado"); if(isNew) go("cliente-"+id); }
  catch(e){ btn.disabled=false; toast(errMsg(e),true); }
}

function renderAvisos(){
  const el=$("#avisos"); if(!el) return;
  el.innerHTML = draft.avisos.length ? draft.avisos.map((a,i)=>`<div class="aviso"><span class="fd">${fmtD(a.fecha)}</span><span class="tx">${esc(a.texto)}</span><button type="button" data-act="del-aviso" data-i="${i}" title="Quitar">${SVG.x}</button></div>`).join("")
    : `<div class="t2" style="color:var(--muted);font-size:13px">Todavía no se registraron avisos.</div>`;
}
function fileUrl(a){ return a.url || ("/_blob/"+a.id); }
function renderFiles(){
  const el=$("#files"); if(!el) return;
  el.innerHTML=draft.adjuntos.map((a,i)=>{
    const img=(a.tipo||"").startsWith("image/");
    return `<div class="file ${a.uploading?"up":""}">
      <div class="th" ${a.uploading?"":`data-act="ver-adj" data-i="${i}"`}>${a.uploading?'<span class="t2">Subiendo…</span>':img?`<img src="${esc(fileUrl(a))}" alt="">`:'<span class="pdf">PDF</span>'}</div>
      <div class="nm" title="${esc(a.nombre)}">${esc(a.nombre)}</div>
      ${a.uploading?"":`<button type="button" class="x" data-act="del-adj" data-i="${i}" title="Quitar">${SVG.x}</button>`}
    </div>`; }).join("");
}
async function handleFiles(files){
  for(const f of files){
    const ok=f.type==="application/pdf"||f.type.startsWith("image/");
    if(!ok){ toast(`"${f.name}" no es PDF ni imagen`,true); continue; }
    if(f.size>20*1024*1024){ toast(`"${f.name}" supera los 20 MB`,true); continue; }
    const ph={uploading:true,nombre:f.name,tipo:f.type}; draft.adjuntos.push(ph); renderFiles();
    try{
      const r=await Store.upload(f);
      Object.assign(ph,{uploading:false,id:r.id,url:r.url,tipo:r.contentType||f.type,size:r.sizeBytes||f.size,subido:new Date().toISOString()});
      delete ph.uploading; if(modal) modal.newUploads.push(r.id);
    }catch(e){ draft.adjuntos=draft.adjuntos.filter(x=>x!==ph); toast(`No se pudo subir "${f.name}"`,true); }
    renderFiles();
  }
}
async function saveDeuda(form){
  const fd=Object.fromEntries(new FormData(form));
  if(!fd.clienteId) return toast("Seleccioná un cliente",true);
  if(!fd.fechaVto) return toast("Ingresá la fecha de vencimiento",true);
  const imp=parseImporte(fd.importe); if(!(imp>0)) return toast("Ingresá un importe válido",true);
  const id=modal.id||uid("d");
  const obj={...draft, clienteId:fd.clienteId, categoria:fd.categoria, concepto:fd.concepto.trim(), periodo:fd.periodo.trim(), cuota:fd.cuota.trim(), nroVep:fd.nroVep.trim(),
    importe:imp, fechaEnvio:fd.fechaEnvio||"", fechaVto:fd.fechaVto, estado:fd.estado==="pagado"?"pagado":"pendiente", fechaPago:fd.estado==="pagado"?(fd.fechaPago||TODAY):"",
    observaciones:fd.observaciones.trim(), adjuntos:undefined, creado:draft.creado||new Date().toISOString(), actualizado:new Date().toISOString()};
  const btn=form.querySelector("[type=submit]"); btn.disabled=true;
  try{ await Store.set("deudas",id,obj); const isNew=!modal.id; closeModal(); toast(isNew?"Deuda cargada":"Cambios guardados"); }
  catch(e){ btn.disabled=false; toast(errMsg(e),true); }
}
function cancelDeuda(){ if(modal&&modal.type==="deuda"){ modal.newUploads.forEach(x=>Store.removeAsset(x)); } closeModal(); }

function viewer(a){
  const img=(a.tipo||"").startsWith("image/"); const u=fileUrl(a);
  const wrap=document.createElement("div");
  wrap.innerHTML=`<div class="overlay" style="z-index:65"><div class="modal viewer"><div class="mh"><h2 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.nombre)}</h2><div style="display:flex;gap:8px"><a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">Abrir en pestaña nueva</a><button class="btn ghost sm" data-v="x">${SVG.x}</button></div></div>
    <div class="vb">${img?`<img src="${esc(u)}" alt="">`:`<iframe src="${esc(u)}" title="PDF"></iframe>`}</div></div></div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("click",e=>{ if(e.target.closest("[data-v]")||e.target.classList.contains("overlay")) wrap.remove(); });
}

/* ---------- Copia de seguridad ---------- */
function lastBackup(){ try{ return localStorage.getItem("lazarte_crm_lastbackup")||""; }catch(e){ return ""; } }
function backupBanner(){
  const lb=lastBackup(); if(!state.deudas.size&&!state.clientes.size) return "";
  const dias = lb ? diffDays(TODAY, lb.slice(0,10)) : null;
  if(dias!==null && dias<7) return "";
  return `<div class="banner" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span>${lb?`Tu última copia de seguridad es de hace ${dias} días.`:"Todavía no hiciste una copia de seguridad."} Los datos se guardan solo en este navegador: exportá una copia periódicamente.</span><button class="btn sm" data-act="exportar">Exportar copia ahora</button></div>`;
}
function downloadFile(name, content, type){
  const blob=new Blob([content],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
function exportar(){
  const data={app:"CRM Estudio Lazarte",version:1,exportado:new Date().toISOString(),clientes:Store.local.clientes,deudas:Store.local.deudas};
  downloadFile(`CRM_Lazarte_respaldo_${TODAY}.json`, JSON.stringify(data,null,1), "application/json");
  try{ localStorage.setItem("lazarte_crm_lastbackup", new Date().toISOString()); }catch(e){}
  toast("Copia de seguridad descargada"); if(state.route==="panel") render();
}
function backupDlg(){
  modal={type:"backup"}; const lb=lastBackup();
  openModal(`<div class="mh"><h2>Copia de seguridad</h2><button class="btn ghost sm" data-act="close">${SVG.x}</button></div>
  <div class="mb">
    <div>Los datos del CRM se guardan en este navegador de esta computadora. Exportá una copia periódicamente (por ejemplo, todos los viernes) y guardala en una carpeta del estudio o en Drive. Con ese archivo también podés pasar los datos a otra computadora.</div>
    <div class="t2" style="color:var(--muted)">${state.clientes.size} clientes · ${state.deudas.size} deudas cargadas · Última copia: ${lb?fmtD(lb.slice(0,10)):"nunca"}</div>
    <div class="sect">Exportar</div>
    <div><button class="btn pri" data-act="exportar">Descargar copia (.json)</button></div>
    <div class="sect">Importar</div>
    <div>Elegí un archivo de respaldo descargado antes. <b>Reemplaza</b> todos los datos actuales de este navegador.</div>
    <div><label class="btn" style="display:inline-flex">Elegir archivo de respaldo…<input type="file" id="impfile" accept=".json,application/json" class="hidden"></label></div>
  </div>`,"sm");
}
async function importar(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ return toast("El archivo no es un respaldo válido",true); }
  if(!data||typeof data.clientes!=="object"||typeof data.deudas!=="object") return toast("El archivo no es un respaldo del CRM",true);
  const nc=Object.keys(data.clientes).length, nd=Object.keys(data.deudas).length;
  const ok=await confirmDlg("Importar respaldo",`Se reemplazarán los datos actuales por los del respaldo (${nc} clientes y ${nd} deudas${data.exportado?", del "+fmtD(String(data.exportado).slice(0,10)):""}). ¿Continuar?`,"Importar",false);
  if(!ok) return;
  Store.replaceAll(data); closeModal(); shellFor=null; render(); toast("Respaldo importado");
}
function descargarCSV(){
  const tsv=tablaTSV(); const csv=tsv.split("\n").map(r=>r.split("\t").map(x=>/[";\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x).join(";")).join("\r\n");
  downloadFile(`Deudas_clientes_${TODAY}.csv`, "\ufeff"+csv, "text/csv;charset=utf-8");
}

/* ---------- Acciones ---------- */
async function quickUpdate(id, patch, msg){
  const d=state.deudas.get(id); if(!d) return;
  try{ await Store.set("deudas",id,{...d,...patch,actualizado:new Date().toISOString()}); if(msg) toast(msg); }
  catch(e){ toast(errMsg(e),true); }
}
async function logWa(ids){
  for(const id of ids){ const d=state.deudas.get(id); if(!d) continue;
    await quickUpdate(id,{avisos:[...(d.avisos||[]),{fecha:TODAY,texto:"Aviso enviado por WhatsApp"}], fechaEnvio:d.fechaEnvio||TODAY}); }
  toast("Aviso registrado");
}
function tablaTSV(){
  const {list}=filtradas();
  const rows=[["Cliente","CUIT","Tipo","Concepto","Período","Cuota","N° VEP","Fecha envío","Vencimiento","Importe","Estado","Días atraso","Fecha pago","Último aviso"]];
  list.forEach(d=>{const c=cliente(d.clienteId)||{};const i=info(d);const av=(d.avisos||[]).slice(-1)[0];
    rows.push([c.razon||"",fmtCuit(c.cuit),CAT[d.categoria]?.n||"",d.concepto||"",d.periodo||"",d.cuota||"",d.nroVep||"",fmtD(d.fechaEnvio),fmtD(d.fechaVto),String(d.importe).replace(".",","),i.label,i.dias||"",d.fechaPago?fmtD(d.fechaPago):"",av?fmtD(av.fecha)+" "+av.texto:""]);});
  return rows.map(r=>r.map(x=>String(x).replace(/[\t\n]/g," ")).join("\t")).join("\n");
}

document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-act]");
  if(e.target.id==="ov" && !t){ if(modal?.type==="deuda") cancelDeuda(); else closeModal(); return; }
  if(!t) return;
  const act=t.dataset.act, id=t.dataset.id;
  switch(act){
    case "close": if(modal?.type==="deuda") cancelDeuda(); else closeModal(); break;
    case "go": go(t.dataset.r); break;
    case "nuevo-cliente": clienteForm(null); break;
    case "editar-cliente": clienteForm(cliente(id)); break;
    case "ver-cliente": go("cliente-"+id); break;
    case "nueva-deuda": deudaForm(null, t.dataset.cid); break;
    case "ver-deuda": if(e.target.closest("a,button")&&e.target.closest("[data-act]")!==t) return; deudaForm(state.deudas.get(id)); break;
    case "ver-vencidos": state.f.estado="venc"; break;
    case "pagar": e.stopPropagation(); await quickUpdate(id,{estado:"pagado",fechaPago:TODAY},"Marcada como pagada"); break;
    case "reabrir": e.stopPropagation(); await quickUpdate(id,{estado:"pendiente",fechaPago:""},"Volvió a pendiente"); break;
    case "copiar": copyText(t.dataset.txt); break;
    case "copiar-msg": copyText($("#msgtxt").value,"Mensaje copiado"); break;
    case "backup": backupDlg(); break;
    case "exportar": exportar(); break;
    case "csv": descargarCSV(); break;
    case "copiar-tabla": copyText(tablaTSV(),"Tabla copiada: pegala en Excel"); break;
    case "mensaje": { const c=cliente(t.dataset.cid); const l=sortDeudas(deudasDe(c.id).filter(isPend)); showText("Mensaje de deuda para "+c.razon, mensajeAviso(c,l)); break; }
    case "borrar-cliente": {
      const c=cliente(id); const ds=deudasDe(id);
      const ok=await confirmDlg("Eliminar cliente", `Se eliminará "${c.razon}"${ds.length?` junto con sus ${ds.length} deuda(s)`:""}. Esta acción no se puede deshacer.`);
      if(!ok) return;
      try{ for(const d of ds){ await Store.del("deudas",d.id); (d.adjuntos||[]).forEach(a=>Store.removeAsset(a.id)); } await Store.del("clientes",id); toast("Cliente eliminado"); go("clientes"); }
      catch(err){ toast(errMsg(err),true); }
      break; }
    case "borrar-deuda": {
      const ok=await confirmDlg("Eliminar deuda","Se eliminará esta deuda con sus avisos. Esta acción no se puede deshacer.");
      if(!ok) return;
      const did=modal.id; const d=state.deudas.get(did);
      try{ await Store.del("deudas",did); modal.newUploads.forEach(x=>Store.removeAsset(x)); (d?.adjuntos||[]).forEach(a=>Store.removeAsset(a.id)); closeModal(); toast("Deuda eliminada"); }
      catch(err){ toast(errMsg(err),true); }
      break; }
    case "add-aviso": {
      const tx=$("#avt").value.trim(); if(!tx){ $("#avt").focus(); return; }
      draft.avisos.push({fecha:$("#avf").value||TODAY,texto:tx}); draft.avisos.sort((a,b)=>a.fecha.localeCompare(b.fecha)); $("#avt").value=""; renderAvisos(); break; }
    case "del-aviso": draft.avisos.splice(+t.dataset.i,1); renderAvisos(); break;
    case "ver-adj": viewer(draft.adjuntos[+t.dataset.i]); break;
    case "del-adj": { const [a]=draft.adjuntos.splice(+t.dataset.i,1); if(a?.id){ if(modal.newUploads.includes(a.id)){ Store.removeAsset(a.id); modal.newUploads=modal.newUploads.filter(x=>x!==a.id);} else modal.removed.push(a.id);} renderFiles(); break; }
  }
});
document.addEventListener("click",e=>{
  const b=e.target.closest("#tiposeg button"); if(b){ state.f.tipo=b.dataset.tipo; document.querySelectorAll("#tiposeg button").forEach(x=>x.classList.toggle("on",x===b)); fillClientes(); }
  const s=e.target.closest("#estseg button"); if(s){ state.f.estado=s.dataset.est; fillVenc(); }
  const d=e.target.closest("#dtabs button"); if(d){ state.f.dtab=d.dataset.dtab; render(); }
  if(e.target.closest("#drop")&&!e.target.closest("input")) $("#fileinp")?.click();
});
document.addEventListener("input",e=>{
  if(e.target.id==="cq"){ state.f.cq=e.target.value; fillClientes(); }
  if(e.target.id==="q"){ state.f.q=e.target.value; fillVenc(); }
});
document.addEventListener("change",e=>{
  if(e.target.id==="fcat"){ state.f.cat=e.target.value; fillVenc(); }
  if(e.target.id==="fmes"){ state.f.mes=e.target.value; fillVenc(); }
  if(e.target.id==="impfile"&&e.target.files[0]){ importar(e.target.files[0]); e.target.value=""; }
  if(e.target.id==="fileinp"){ handleFiles([...e.target.files]); e.target.value=""; }
  if(e.target.name==="estado"){ const pag=e.target.value==="pagado"; $("#fpagobox").classList.toggle("hidden",!pag);
    const ls=document.querySelectorAll("#epick label"); ls[0].className=pag?"":"on-p"; ls[1].className=pag?"on-g":""; }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && modal && !document.querySelector(".overlay[style*='z-index']")){ if(modal.type==="deuda") cancelDeuda(); else closeModal(); }
  if(e.key==="Enter" && e.target.id==="avt"){ e.preventDefault(); document.querySelector('[data-act="add-aviso"]').click(); }
});
document.addEventListener("submit",e=>{ e.preventDefault(); if(e.target.id==="fcli") saveCliente(e.target); if(e.target.id==="fdeu") saveDeuda(e.target); });
["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{ const d=e.target.closest&&e.target.closest("#drop"); if(d){ e.preventDefault(); d.classList.add("over"); } }));
document.addEventListener("dragleave",e=>{ const d=e.target.closest&&e.target.closest("#drop"); if(d) d.classList.remove("over"); });
document.addEventListener("drop",e=>{ const d=e.target.closest&&e.target.closest("#drop"); if(d){ e.preventDefault(); d.classList.remove("over"); handleFiles([...e.dataTransfer.files]); } else if(modal) e.preventDefault(); });

/* ---------- Inicio ---------- */
$("#hoy").textContent="Hoy: "+fmtD(TODAY);
readHash(); render();
Store.init(render);
</script>
</body>
</html>
